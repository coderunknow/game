name: Windows release

# Builds and validates the Windows x64 desktop package of Plants vs. Zombies:
# MODDED on a real Windows runner.
#
# Triggers
#   pull_request (packaging paths only) : build + validate only, never publishes.
#   workflow_dispatch                   : build + validate; if release_tag is
#                                         given, build from that tag and attach
#                                         the assets to that release.
#   push of a v* tag                    : build + validate + publish a pre-release.
#   release published                   : attach freshly built assets to that
#                                         release (idempotent, overwrites).
#
# Least privilege: contents:write only (needed to create releases / upload
# assets). No deployment, mirroring or upstream write access.
#
# Note on the toolchain pin: ziglang publishes Windows wheels only up to
# 0.16.0 (0.17.0 has manylinux/macOS wheels but no win_amd64 wheel), so
# 0.16.0 is pinned for all platforms to keep one toolchain everywhere.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build from and attach assets to (leave empty to build+validate only)"
        required: false
        default: ""
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/build-windows.sh"
      - "scripts/make-installer.py"
      - ".github/workflows/windows-release.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve build ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.sha }}"
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            if [ -n "$TAG" ]; then REF="$TAG"; fi
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            REF="$TAG"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building from ref=$REF publish_tag=${TAG:-<none>}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain (ziglang==0.16.0)
        run: python -m pip install ziglang==0.16.0

      - name: Build installer + portable ZIP
        shell: bash
        run: bash scripts/build-windows.sh

      - name: Validate packaged application (--selftest)
        shell: bash
        working-directory: build/win/portable
        run: |
          # PVZM.exe is a GUI-subsystem executable: stdout is not attached to a
          # console, so read the JSON result from the file it writes.
          ./PVZM.exe --selftest selftest.json || echo "selftest exit=$?"
          cat selftest.json
          python -c "import json; d=json.load(open('selftest.json')); assert d['layout'] and d['webview2Runtime'], d; print('selftest OK', d)"

      - name: Validate packaged application (--smoke, real Soak-shroom gameplay)
        shell: bash
        working-directory: build/win/portable
        run: |
          # Drives the packaged app end to end: boots the game, loads level 1-1,
          # plants Soak-shroom on the top row and a lower row, spawns zombies and
          # verifies bullets, damage, animation and game-loop survival.
          ./PVZM.exe --smoke smoke.json || { echo "smoke exited non-zero"; cat smoke.json 2>/dev/null; exit 1; }
          cat smoke.json
          python -c "
          import json
          d = json.load(open('smoke.json'))
          assert d.get('ok'), d
          c = d.get('checks') or {}
          for k in ('bullet', 'shootGif', 'loopAlive', 'localAsset', 'zombieDamaged', 'noReferenceError'):
              assert c.get(k) is True, (k, d)
          print('smoke OK:', d)
          "

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ steps.ref.outputs.tag || github.sha }}
          path: |
            dist/PVZM-win64-portable.zip
            dist/PVZM-Setup-x64.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish / attach release assets
        if: steps.ref.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.tag }}"
          NOTES="$(mktemp)"
          {
            echo "Development pre-release. See desktop/RELEASE-NOTES.md in the repository for details."
            echo
            echo "Built by .github/workflows/windows-release.yml on a Windows runner from ref \`$TAG\`."
            echo
            echo "### SHA-256"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Unsigned executables. Requires Windows 10 x64 and the Microsoft Edge WebView2 Runtime."
            echo "Portable ZIP: extract the whole archive and run PVZM.exe. Installer: per-user, no admin rights."
          } > "$NOTES"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG exists -> attaching assets"
            gh release upload "$TAG" \
              dist/PVZM-win64-portable.zip \
              dist/PVZM-Setup-x64.exe \
              dist/SHA256SUMS.txt \
              --repo "${{ github.repository }}" --clobber
          else
            echo "creating pre-release $TAG"
            gh release create "$TAG" \
              dist/PVZM-win64-portable.zip \
              dist/PVZM-Setup-x64.exe \
              dist/SHA256SUMS.txt \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "$TAG" \
              --notes-file "$NOTES"
          fi
