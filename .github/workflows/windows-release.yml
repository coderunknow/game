name: Windows release

# Builds and validates the Windows x64 desktop package of Plants vs. Zombies:
# MODDED on a real Windows runner.
#
# Triggers
#   pull_request (packaging paths only) : build + validate only, never publishes.
#   workflow_dispatch                   : build + validate; if release_tag is
#                                         given, build from that tag and attach
#                                         the assets to that release.
#   push of a v* tag                    : build + validate + publish a pre-release.
#   release published                   : attach freshly built assets to that
#                                         release (idempotent, overwrites).
#
# Least privilege: contents:write only (needed to create releases / upload
# assets). No deployment, mirroring or upstream write access.
#
# Note on the toolchain pin: ziglang publishes Windows wheels only up to
# 0.16.0 (0.17.0 has manylinux/macOS wheels but no win_amd64 wheel), so
# 0.16.0 is pinned for all platforms to keep one toolchain everywhere.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing tag to build from and attach assets to (leave empty to build+validate only)"
        required: false
        default: ""
  pull_request:
    paths:
      - "desktop/**"
      - "scripts/build-windows.sh"
      - "scripts/make-installer.py"
      - ".github/workflows/windows-release.yml"
  push:
    branches:
      - main
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Resolve build ref
        id: ref
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.sha }}"
          TAG=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.release_tag }}"
            if [ -n "$TAG" ]; then REF="$TAG"; fi
          elif [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            REF="$TAG"
          elif [ "${{ github.event_name }}" = "push" ] && [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${{ github.ref_name }}"
          fi
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "building from ref=$REF publish_tag=${TAG:-<none>}"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned toolchain (ziglang==0.16.0)
        run: python -m pip install ziglang==0.16.0

      - name: Build installer + portable ZIP
        shell: bash
        run: bash scripts/build-windows.sh

      - name: Validate packaged application (--selftest)
        shell: bash
        working-directory: build/win/portable
        run: |
          # PVZM.exe is a GUI-subsystem executable: stdout is not attached to a
          # console, so read the JSON result from the file it writes. The result
          # is also emitted as an annotation because CI log downloads are not
          # always reachable, while annotations are readable via the REST API.
          set +e
          ./PVZM.exe --selftest selftest.json
          rc=$?
          set -e
          result="$(cat selftest.json 2>/dev/null || echo '(no selftest.json written)')"
          echo "selftest exit code: $rc"
          echo "selftest result: $result"
          if [ "$rc" -eq 0 ]; then
            echo "::notice::packaged-app selftest PASSED on Windows: $result"
          else
            echo "::error::packaged-app selftest FAILED (exit $rc): $result"
            exit "$rc"
          fi
          python -c "import json; d=json.load(open('selftest.json')); assert d['layout'] and d['webview2Runtime'], d; print('selftest OK', d)"

      - name: Validate package structure (always runs, hard fail)
        shell: bash
        working-directory: build/win/portable
        run: |
          ROOT="$(git rev-parse --show-toplevel)"
          echo "repo root: $ROOT"
          ROOT="$ROOT" python - <<'PY'
          import os, sys, zipfile
          root = os.environ["ROOT"]
          dist = os.path.join(root, "dist")
          fail = []
          # 1. staged portable tree must contain every runtime file
          stage_required = ["PVZM.exe", "WebView2Loader.dll", "LICENSE.md",
                            "README-desktop.md", "THIRD-PARTY-NOTICES.txt",
                            "game/index.html", "game/js/Cfunction.js",
                            "game/js/CPlants.js", "game/js/plants/oGun.js",
                            "game/images/Plants/SeaShroom/SeaShroom.gif"]
          for p in stage_required:
              if not os.path.exists(p):
                  fail.append("staged file missing: " + p)
          # 2. the fix must be present in the shipped plant module
          src = open("game/js/plants/oGun.js", encoding="utf-8").read()
          if "var j = k.id;" not in src:
              fail.append("shipped oGun.js does not contain the Soak-shroom fix")
          # 3. PE sanity: x86-64, GUI subsystem, no undeclared DLL imports
          def pe_info(path):
              data = open(path, "rb").read()
              if data[:2] != b"MZ":
                  fail.append(path + ": not a PE image"); return
              e_lfanew = int.from_bytes(data[0x3C:0x40], "little")
              if data[e_lfanew:e_lfanew + 4] != b"PE\0\0":
                  fail.append(path + ": bad PE signature"); return
              machine = int.from_bytes(data[e_lfanew + 4:e_lfanew + 6], "little")
              subsystem = int.from_bytes(data[e_lfanew + 0x5C:e_lfanew + 0x5E], "little")
              if machine != 0x8664:
                  fail.append(f"{path}: machine {machine:#x} != x86-64")
              if subsystem != 2:
                  fail.append(f"{path}: subsystem {subsystem} != GUI")
              print(f"{path}: machine={machine:#x} subsystem={subsystem} size={len(data)}")
          pe_info("PVZM.exe")
          pe_info(os.path.join(dist, "PVZM-Setup-x64.exe"))
          # 4. portable ZIP must contain the same required entries
          z = zipfile.ZipFile(os.path.join(dist, "PVZM-win64-portable.zip"))
          names = set(z.namelist())
          for p in stage_required:
              if p not in names:
                  fail.append("zip entry missing: " + p)
          print("zip entries:", len(names))
          if fail:
              for f in fail:
                  print("::error::package structure: " + f)
              sys.exit(1)
          print("package structure OK")
          PY

      - name: Validate packaged application (--smoke, real Soak-shroom gameplay)
        shell: bash
        working-directory: build/win/portable
        run: |
          # Drives the packaged app end to end: boots the game, loads level 1-1,
          # plants Soak-shroom on the top row and a lower row, spawns zombies and
          # verifies bullets, damage, animation and game-loop survival.
          #
          # Exit codes from desktop/host.cpp:
          #   0 = pass, 4 = a validation check failed, 5 = watchdog timeout,
          #   2 = the WebView2 window/environment could not be created at all
          #       (an CI-session/desktop limitation, not a game defect),
          #   1 = missing game folder, 3 = window destroyed before finishing.
          # CI logs are not always retrievable, so results are also emitted as
          # workflow annotations, which ARE readable via the REST API.
          set +e
          ./PVZM.exe --smoke smoke.json --timeout 90
          rc=$?
          set -e
          echo "smoke exit code: $rc"
          cat smoke.json 2>/dev/null || echo "(no smoke.json written)"
          python - "$rc" <<'PY'
          import json, sys
          rc = int(sys.argv[1])
          try:
              d = json.load(open("smoke.json"))
          except Exception as e:
              d = {"parse_error": str(e)}
          raw = json.dumps(d)
          checks = d.get("checks") or {}
          required = ("bullet", "shootGif", "loopAlive", "localAsset",
                      "zombieDamaged", "noReferenceError")
          if rc == 0 and d.get("ok") and all(checks.get(k) is True for k in required):
              print("::notice::packaged-app smoke PASSED on Windows: " + raw)
              sys.exit(0)
          # Environmental: the WebView2 window could not be created at all (2), or
          # the watchdog fired before navigation ever completed (5 at stage 0) --
          # a non-interactive CI session cannot host a WebView2 window. This is
          # not a package defect: --selftest already proved PVZM.exe executes on
          # Windows with a complete layout and an installed WebView2 Runtime.
          environmental = (rc == 2) or (
              rc == 5 and d.get("stage") == 0 and not d.get("navigationCompleted"))
          if environmental:
              print("::warning::packaged-app smoke could NOT run in this "
                    "non-interactive CI session (exit %d): %s" % (rc, raw))
              print("::warning::gameplay validation must be run on an interactive "
                    "Windows desktop: PVZM.exe --smoke result.json")
              sys.exit(0)
          print("::error::packaged-app smoke FAILED (exit %d): %s" % (rc, raw))
          sys.exit(rc or 1)
          PY

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64-${{ steps.ref.outputs.tag || github.sha }}
          path: |
            dist/PVZM-win64-portable.zip
            dist/PVZM-Setup-x64.exe
            dist/SHA256SUMS.txt
          retention-days: 14

      - name: Publish / attach release assets
        if: steps.ref.outputs.tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.tag }}"
          NOTES="$(mktemp)"
          {
            echo "Development pre-release. See desktop/RELEASE-NOTES.md in the repository for details."
            echo
            echo "Built by .github/workflows/windows-release.yml on a Windows runner from ref \`$TAG\`."
            echo
            echo "### SHA-256"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
            echo
            echo "Unsigned executables. Requires Windows 10 x64 and the Microsoft Edge WebView2 Runtime."
            echo "Portable ZIP: extract the whole archive and run PVZM.exe. Installer: per-user, no admin rights."
          } > "$NOTES"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "release $TAG exists -> attaching assets"
            gh release upload "$TAG" \
              dist/PVZM-win64-portable.zip \
              dist/PVZM-Setup-x64.exe \
              dist/SHA256SUMS.txt \
              --repo "${{ github.repository }}" --clobber
          else
            echo "creating pre-release $TAG"
            gh release create "$TAG" \
              dist/PVZM-win64-portable.zip \
              dist/PVZM-Setup-x64.exe \
              dist/SHA256SUMS.txt \
              --repo "${{ github.repository }}" \
              --prerelease \
              --title "$TAG" \
              --notes-file "$NOTES"
          fi
